<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Question For You ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hearts"></div>

    <main class="card">

        <!-- Replace photo1.jpg with your own photo filename -->
        <img src="photo1.jpg" alt="A special photo" class="main-photo">

        <h1>Will you be my girlfriend? ❤️</h1>

        <p class="subtitle">
            I have a little question for you...
        </p>

        <div class="buttons">

            <button class="yes-btn" onclick="chooseYes()">
                Yes ❤️
            </button>

            <button class="no-btn" onclick="chooseNo()">
                No 🙈
            </button>

        </div>

    </main>

<script>

    /*
    ==========================================
    GOOGLE FORM INFORMATION
    ==========================================
    */

    const GOOGLE_FORM_URL =
        "https://docs.google.com/forms/d/e/1FAIpQLSc28yc45jHU43WHw-4nm1hPmrI0QRxgV8ETzWIFn67TggTegQ/formResponse";


    /*
    ==========================================
    RECORD THE ANSWER
    ==========================================
    */

    function recordAnswer(answer) {

        const formData = new FormData();

        formData.append("entry.2077869700", answer);

        /*
        We don't need to select a date yet.
        */

        fetch(GOOGLE_FORM_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
        });

    }


    /*
    ==========================================
    YES BUTTON
    ==========================================
    */

    function chooseYes() {

        recordAnswer("Yes");

        window.location.href = "date.html";

    }


    /*
    ==========================================
    NO BUTTON
    ==========================================
    */

    function chooseNo() {

        recordAnswer("No");

        window.location.href =
            "https://youtube.com/shorts/qdbbJzXCHpo?si=wT5N5p4_AEnVuDys";

    }

</script>

</body>
</html>
